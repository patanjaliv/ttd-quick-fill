<!doctype html><html><head><meta charset="utf-8"><title>Mock TTD pilgrim details</title>
<style>body{font:14px system-ui;margin:20px} .row{display:flex;gap:8px;margin:6px 0} input{padding:4px} .combo{position:relative} ul{position:absolute;margin:0;padding:0;list-style:none;background:#fff;border:1px solid #888;z-index:5} li{padding:4px 8px;cursor:pointer} img{width:12px;height:12px;background:red}</style>
</head><body>
<div id="root"></div>
<script>window.__errors=[];window.addEventListener("error",e=>{__errors.push(String(e.message||e));document.getElementById("state").textContent="ERR "+__errors.join("; ")});</script>
<pre id="state"></pre>
<script src="react.js"></script><script src="react-dom.js"></script>
<script>
const { useState, createElement: h } = React;
const GENDERS = ['Female','Male','Transgender'], IDS = ['Aadhaar Card','Passport'];
function Combo({name, options, value, onChange, disabled}) {
  const [open, setOpen] = useState(false);
  return h('div', {className:'combo'},
    h('div', null, h('input', {name, value, disabled, placeholder:name, onChange:()=>{}, onClick:()=>!disabled&&setOpen(o=>!o)})),
    open && h('ul', null, options.map(o => h('li', {key:o, role:'option', onClick:()=>{onChange(o); setOpen(false);}}, o))));
}
function Text({name, value, onChange, disabled, error}) {
  return h('div', null, h('div', null, h('input', {name, value, disabled, placeholder:name, onChange:e=>onChange(e.target.value)}),
    error && h('img', {src:'/erroricon.svg', alt:'error'})));
}
const blankRow = () => ({fname:'', age:'', gender:'', photoIdType:'', idProofNumber:''});
function App() {
  const [rows, setRows] = useState([blankRow(), blankRow(), blankRow()]);
  const [general, setGeneral] = useState({emailId:'', city:'', state:'', country:'', pincode:''});
  const [events, setEvents] = useState([]);
  const log = (m) => setEvents(e => [...e, m]);
  const upd = (i, k) => v => { log(`${k}[${i}]=${v}`); setRows(r => r.map((row, j) => j===i ? {...row, [k]:v} : row)); };
  document.getElementById('state').textContent = JSON.stringify({rows, general}, null, 1);
  return h('div', null,
    rows.map((row, i) => h('div', {className:'row', key:i},
      h(Text, {name:'fname', value:row.fname, onChange:upd(i,'fname'), error: /\d/.test(row.fname)}),
      h(Text, {name:'age', value:row.age, onChange:upd(i,'age'), error: row.age!=='' && !/^\d{1,3}$/.test(row.age)}),
      h(Combo, {name:'gender', options:GENDERS, value:row.gender, onChange:upd(i,'gender')}),
      h(Combo, {name:'photoIdType', options:IDS, value:row.photoIdType, onChange:upd(i,'photoIdType'), disabled: row.age===''}),
      h(Text, {name:'idProofNumber', value:row.idProofNumber, onChange:upd(i,'idProofNumber'), disabled: row.photoIdType===''}))),
    h('h3', null, 'General Details'),
    h('div', {className:'row'}, Object.keys(general).map(k => h(Text, {key:k, name:k, value:general[k], onChange:v=>setGeneral(g=>({...g,[k]:v}))}))),
    h('button', {type:'button', onClick:()=>alert('continue')}, 'Continue'),
    h('pre', {id:'events'}, events.join('\n')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
